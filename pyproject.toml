[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbarrage"
version = "0.1.0"
description = "Local desktop barrage notifications for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AgentBarrage contributors"}]
keywords = ["codex", "claude-code", "codebuddy", "notifications", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10,<13"]

[project.scripts]
agent-barrage = "agent_barrage.display.macos:main"
agent-barrage-send = "agent_barrage.send:main"
agent-barrage-hooks = "agent_barrage.install:main"
agent-barrage-emit = "agent_barrage.emit:main"
agent-barrage-bridge = "agent_barrage.bridge:main"

[tool.setuptools.packages.find]
include = ["agent_barrage*"]
