[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmarquee"
version = "0.2.0"
description = "Local desktop barrage notifications for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "AgentMarquee contributors"}]
keywords = ["codex", "claude-code", "codebuddy", "notifications", "macos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-Cocoa>=10,<13", "pyobjc-framework-ApplicationServices>=10,<13"]

[project.scripts]
agent-marquee = "agent_marquee.display.macos:main"
agent-marquee-send = "agent_marquee.send:main"
agent-marquee-hooks = "agent_marquee.install:main"
agent-marquee-emit = "agent_marquee.emit:main"
agent-marquee-bridge = "agent_marquee.bridge:main"
agent-barrage = "agent_marquee.display.macos:main"
agent-barrage-send = "agent_marquee.send:main"
agent-barrage-hooks = "agent_marquee.install:main"
agent-barrage-emit = "agent_marquee.emit:main"
agent-barrage-bridge = "agent_marquee.bridge:main"

[tool.setuptools.packages.find]
include = ["agent_marquee*", "agent_barrage*"]
